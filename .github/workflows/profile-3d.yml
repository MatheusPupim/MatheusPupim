name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 03:00 UTC (00:00 BRT)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - name: Gerar calendário de contribuições em 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # PROFILE_TOKEN é um PAT opcional com escopo `read:user` (+ `repo`
          # para contabilizar contribuições em repositórios privados).
          # Sem ele, cai no GITHUB_TOKEN padrão, que enxerga apenas repos públicos.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commitar artefatos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no gráfico — nada a commitar."
          else
            git commit -m "chore: atualiza gráfico de contribuições 3D [skip ci]"
            git push
          fi
