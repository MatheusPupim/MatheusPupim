name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 03:00 UTC (00:00 BRT)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gera a grade bruta uma única vez. As cores não são definidas aqui:
      # quem controla a paleta é o script de acabamento, que deriva as duas
      # variantes de tema a partir deste mesmo arquivo.
      - name: Gerar animação da grade de contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake-bruto.svg

      - name: Aplicar acabamento visual (paleta + palco)
        run: |
          python3 scripts/embelezar-snake.py \
            dist/snake-bruto.svg \
            dist/github-contribution-grid-snake.svg --tema light
          python3 scripts/embelezar-snake.py \
            dist/snake-bruto.svg \
            dist/github-contribution-grid-snake-dark.svg --tema dark
          rm dist/snake-bruto.svg
          ls -la dist/

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
