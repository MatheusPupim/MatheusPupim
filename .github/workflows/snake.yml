name: Generate Snake Animation

# Aposentado em favor do gráfico 3D (profile-3d.yml), que rende melhor
# quando o calendário está preenchido. Mantido como acionamento manual:
# basta rodar pela aba Actions para regenerar a animação da cobrinha.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar animação da grade de contribuições
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=blue&color_dots=green,red&bg_color=transparent
            dist/github-contribution-grid-snake-dark.svg?color_snake=blue&color_dots=green,red&bg_color=transparent

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
